name: Diagnosis

# Manual diagnosis of a known failure. The automated path is ci-integration.yml.

on:
  workflow_dispatch:
    inputs:
      failing_command:
        description: 'Command that fails (e.g. "go test ./...", "pytest -q", "cargo test")'
        required: true
      base_ref:
        description: 'Base revision to compare against (e.g. main); defaults to the default branch merge-base'
        required: false
        default: ''
      head_ref:
        description: 'Revision to diagnose; defaults to the selected branch'
        required: false
        default: ''
      attempts:
        description: 'Reproduction attempts per revision'
        required: false
        default: '3'
      docker_image:
        description: 'Docker image containing the repository runtime and test tools'
        required: false
        default: ''
      agent:
        description: 'Ask the configured model gateway to analyze collected evidence'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    uses: ./.github/workflows/ci-diagnose.yml
    with:
      command: ${{ inputs.failing_command }}
      head_sha: ${{ inputs.head_ref }}
      base_ref: ${{ inputs.base_ref }}
      attempts: ${{ inputs.attempts }}
      docker_image: ${{ inputs.docker_image }}
      agent: ${{ inputs.agent }}
      comment: false
