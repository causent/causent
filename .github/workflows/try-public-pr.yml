name: Try Malenia on a public PR

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public GitHub repository, owner/name
        required: true
        type: string
      pull_request:
        description: Pull request number
        required: true
        type: string
      test_command:
        description: Test command to run at the PR head (for example, go test ./...)
        required: true
        type: string
      docker_image:
        description: Optional Docker image with the project's runtime and test tools
        required: false
        type: string
      attempts:
        description: Reproduction attempts
        required: true
        default: '1'
        type: string
      max_probes:
        description: Maximum historical test runs for adaptive localization
        required: true
        default: '3'
        type: string
      skip_adaptive:
        description: Publish the preliminary diagnosis without optional deep experiments
        required: false
        default: false
        type: boolean
      fast_path:
        description: Publish after inconclusive reproduction without expensive comparison/localization
        required: false
        default: true
        type: boolean
      timeout_seconds:
        description: Maximum seconds for each test command
        required: false
        default: '120'
        type: string
      investigation_timeout_seconds:
        description: Maximum seconds for the complete diagnosis
        required: false
        default: '600'
        type: string
      malenia_version:
        description: Pinned Malenia release tag
        required: false
        default: v3
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out Malenia
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs and resolve PR revisions
        id: pr
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PULL_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'target_repository must be owner/name' >&2
            exit 2
          fi
          if [[ ! "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo 'pull_request must be a positive integer' >&2
            exit 2
          fi
          metadata="$RUNNER_TEMP/target-pr.json"
          http_status="$(curl --silent --show-error --location --retry 2 --retry-all-errors \
            "https://api.github.com/repos/$TARGET_REPOSITORY/pulls/$PULL_NUMBER" \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: Malenia-GitHub-Actions' \
            -o "$metadata" -w '%{http_code}')"
          if [[ "$http_status" != 200 ]]; then
            api_message="$(jq -r '.message // "no error message returned"' "$metadata" 2>/dev/null || true)"
            echo "GitHub could not resolve PR $TARGET_REPOSITORY#$PULL_NUMBER (HTTP $http_status): $api_message" >&2
            if [[ "$http_status" == 404 ]]; then
              echo 'Check that target_repository is the public owner/name repository and pull_request is an existing PR number.' >&2
            fi
            exit 2
          fi
          jq -e '.state == "open" and .base.sha and .head.sha' "$metadata" >/dev/null || {
            state="$(jq -r '.state // "unknown"' "$metadata")"
            echo "PR $TARGET_REPOSITORY#$PULL_NUMBER must be open and have resolvable base/head revisions (state: $state)" >&2
            exit 2
          }
          echo "base_sha=$(jq -r '.base.sha' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r '.html_url' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "clone_url=$(jq -r '.base.repo.clone_url' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "artifact_slug=${TARGET_REPOSITORY//\//-}" >> "$GITHUB_OUTPUT"

      - name: Check out target PR
        env:
          CLONE_URL: ${{ steps.pr.outputs.clone_url }}
          PULL_NUMBER: ${{ inputs.pull_request }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target"
          git -C "$RUNNER_TEMP/target" init
          git -C "$RUNNER_TEMP/target" remote add origin "$CLONE_URL"
          git -C "$RUNNER_TEMP/target" fetch --no-tags --depth=1 origin \
            "refs/pull/$PULL_NUMBER/head:refs/remotes/origin/malenia-pr"
          git -C "$RUNNER_TEMP/target" fetch --no-tags --deepen=64 origin \
            "refs/pull/$PULL_NUMBER/head"
          git -C "$RUNNER_TEMP/target" fetch --no-tags --depth=1 origin "$BASE_SHA"
          actual_head="$(git -C "$RUNNER_TEMP/target" rev-parse refs/remotes/origin/malenia-pr)"
          if [ "$actual_head" != "$HEAD_SHA" ]; then
            echo 'PR head changed while preparing the run; restart with the updated PR revision' >&2
            exit 1
          fi
          git -C "$RUNNER_TEMP/target" checkout --detach "$HEAD_SHA"

      - name: Set up Go for Malenia
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Malenia binary
        env:
          MALENIA_VERSION: ${{ inputs.malenia_version }}
        run: |
          set -euo pipefail
          if [[ ! "$MALENIA_VERSION" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo 'malenia_version must be a release tag such as v3' >&2
            exit 2
          fi
          base_url="https://github.com/Malenia-org/Malenia/releases/download/${MALENIA_VERSION}"
          asset=malenia_linux_amd64
          if ! curl --fail --silent --show-error --location \
            "$base_url/$asset" -o "$RUNNER_TEMP/malenia"; then
            asset=causent_linux_amd64
            curl --fail --silent --show-error --location \
              "$base_url/$asset" -o "$RUNNER_TEMP/malenia"
          fi
          curl --fail --silent --show-error --location \
            "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/malenia.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" malenia.SHA256SUMS | sed "s/$asset/malenia/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/malenia"
          "$RUNNER_TEMP/malenia" version

      - name: Diagnose PR
        id: diagnose
        env:
          MALENIA_COMMAND: ${{ inputs.test_command }}
          MALENIA_BASE: ${{ steps.pr.outputs.base_sha }}
          MALENIA_ATTEMPTS: ${{ inputs.attempts }}
          MALENIA_MAX_PROBES: ${{ inputs.max_probes }}
          MALENIA_DOCKER_IMAGE: ${{ inputs.docker_image }}
          MALENIA_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          MALENIA_INVESTIGATION_TIMEOUT_SECONDS: ${{ inputs.investigation_timeout_seconds }}
        run: |
          set -euo pipefail
          if [[ ! "$MALENIA_ATTEMPTS" =~ ^[1-5]$ ]]; then
            echo 'attempts must be between 1 and 5' >&2
            exit 2
          fi
          if [[ ! "$MALENIA_MAX_PROBES" =~ ^[1-6]$ ]]; then
            echo 'max_probes must be between 1 and 6' >&2
            exit 2
          fi
          if [[ ! "$MALENIA_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo 'timeout_seconds must be a positive integer' >&2
            exit 2
          fi
          if [[ ! "$MALENIA_INVESTIGATION_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo 'investigation_timeout_seconds must be a positive integer' >&2
            exit 2
          fi
          args=(diagnose --repo "$RUNNER_TEMP/target" --command "$MALENIA_COMMAND"
            --base "$MALENIA_BASE" --attempts "$MALENIA_ATTEMPTS"
            --max-probes "$MALENIA_MAX_PROBES"
            --timeout "${MALENIA_TIMEOUT_SECONDS}s"
            --investigation-timeout "${MALENIA_INVESTIGATION_TIMEOUT_SECONDS}s"
            --json
            --bundle "$RUNNER_TEMP/malenia-bundle")
          if [ "${{ inputs.skip_adaptive }}" = "true" ]; then
            args+=(--skip-adaptive)
          fi
          if [ "${{ inputs.fast_path }}" = "true" ]; then
            args+=(--fast-path)
          fi
          if [ -n "$MALENIA_DOCKER_IMAGE" ]; then
            args+=(--executor docker --image "$MALENIA_DOCKER_IMAGE")
          fi
          outer_timeout=$((MALENIA_INVESTIGATION_TIMEOUT_SECONDS + 30))
          timeout --signal=TERM --kill-after=15s "${outer_timeout}s" \
            "$RUNNER_TEMP/malenia" "${args[@]}" > "$RUNNER_TEMP/malenia-report.json"

      - name: Write run summary
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PULL_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/malenia-report.json"
          {
            echo "## Malenia test: [$TARGET_REPOSITORY#$PULL_NUMBER]($PR_URL)"
            echo
            echo "**Classification:** $(jq -r '.classification // "unknown"' "$report")"
            echo
            echo "**Reproduced:** $(jq -r '(.baseline.failures // 0|tostring) + "/" + (.baseline.attempts // 0|tostring)' "$report") attempts failed"
            echo
            files="$(jq -r '.localization.likely_files[]? | "- `" + . + "`"' "$report")"
            if [ -n "$files" ]; then
              echo '**Likely files:**'
              echo "$files"
              echo
            fi
            claims="$(jq -r '.claims[]? | "- " + .statement' "$report")"
            if [ -n "$claims" ]; then
              echo '**Hypotheses:**'
              echo "$claims"
              echo
            fi
            echo 'Full JSON report and evidence bundle are attached as the workflow artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnosis report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malenia-pr-diagnosis-${{ steps.pr.outputs.artifact_slug }}-${{ inputs.pull_request }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/malenia-report.json
            ${{ runner.temp }}/malenia-bundle
          if-no-files-found: warn
          retention-days: 14
