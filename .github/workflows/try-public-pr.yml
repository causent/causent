name: Try Malenia on a public PR

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public GitHub repository, owner/name
        required: true
        type: string
      pull_request:
        description: Pull request number
        required: true
        type: string
      test_command:
        description: Test command to run at the PR head (for example, go test ./...)
        required: true
        type: string
      malenia_version:
        description: Prebuilt Malenia release to use; use source_build for unreleased code
        required: false
        default: latest
        type: string
      source_build:
        description: Build Malenia from the checked-out source instead of using a release binary
        required: false
        default: false
        type: boolean
      docker_image:
        description: Optional Docker image with the project's runtime and test tools
        required: false
        type: string
      attempts:
        description: Reproduction attempts
        required: true
        default: '1'
        type: string
      max_probes:
        description: Maximum historical test runs for adaptive localization
        required: true
        default: '3'
        type: string
      skip_adaptive:
        description: Publish the preliminary diagnosis without optional deep experiments
        required: false
        default: false
        type: boolean
      fast_path:
        description: Publish after inconclusive reproduction without expensive comparison/localization
        required: false
        default: true
        type: boolean
      timeout_seconds:
        description: Maximum seconds for each test command
        required: false
        default: '120'
        type: string
      investigation_timeout_seconds:
        description: Maximum seconds for the complete diagnosis
        required: false
        default: '600'
        type: string
      source_run_id:
        description: Existing failed CI workflow run to analyze; when omitted, the latest failed run for the PR head is selected
        required: false
        default: ''
        type: string
      source_ci_url:
        description: Original failed CI URL; accepts a Prow GS URL and derives its build identifier
        required: false
        default: ''
        type: string
      allow_reproduction_fallback:
        description: Run the configured command when no original CI evidence can be collected
        required: false
        default: false
        type: boolean
      repair:
        description: Explicitly run bounded isolated repair verification and include its result
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out Malenia
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs and resolve PR revisions
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PULL_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'target_repository must be owner/name' >&2
            exit 2
          fi
          if [[ ! "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo 'pull_request must be a positive integer' >&2
            exit 2
          fi
          metadata="$RUNNER_TEMP/target-pr.json"
          http_status="$(curl --silent --show-error --location --retry 2 --retry-all-errors \
            "https://api.github.com/repos/$TARGET_REPOSITORY/pulls/$PULL_NUMBER" \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'User-Agent: Malenia-GitHub-Actions' \
            -o "$metadata" -w '%{http_code}')"
          if [[ "$http_status" != 200 ]]; then
            api_message="$(jq -r '.message // "no error message returned"' "$metadata" 2>/dev/null || true)"
            echo "GitHub could not resolve PR $TARGET_REPOSITORY#$PULL_NUMBER (HTTP $http_status): $api_message" >&2
            if [[ "$http_status" == 404 ]]; then
              echo 'Check that target_repository is the public owner/name repository and pull_request is an existing PR number.' >&2
            fi
            exit 2
          fi
          jq -e '.state == "open" and .base.sha and .head.sha' "$metadata" >/dev/null || {
            state="$(jq -r '.state // "unknown"' "$metadata")"
            echo "PR $TARGET_REPOSITORY#$PULL_NUMBER must be open and have resolvable base/head revisions (state: $state)" >&2
            exit 2
          }
          echo "base_sha=$(jq -r '.base.sha' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r '.html_url' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "clone_url=$(jq -r '.base.repo.clone_url' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "artifact_slug=${TARGET_REPOSITORY//\//-}" >> "$GITHUB_OUTPUT"

      - name: Collect original CI evidence
        id: evidence
        if: inputs.source_run_id != '' || steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_CI_URL: ${{ inputs.source_ci_url }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/resolve-source-evidence.sh"

      - name: Check out target PR
        env:
          CLONE_URL: ${{ steps.pr.outputs.clone_url }}
          PULL_NUMBER: ${{ inputs.pull_request }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          FAST_PATH: ${{ inputs.fast_path }}
          EVIDENCE_AVAILABLE: ${{ steps.evidence.outputs.available }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target"
          git -C "$RUNNER_TEMP/target" init
          git -C "$RUNNER_TEMP/target" remote add origin "$CLONE_URL"
          git -C "$RUNNER_TEMP/target" fetch --no-tags --depth=1 origin \
            "refs/pull/$PULL_NUMBER/head:refs/remotes/origin/malenia-pr"
          if [[ "$FAST_PATH" != "true" || "$EVIDENCE_AVAILABLE" == "true" ]]; then
            git -C "$RUNNER_TEMP/target" fetch --no-tags --deepen=64 origin \
              "refs/pull/$PULL_NUMBER/head"
            git -C "$RUNNER_TEMP/target" fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          actual_head="$(git -C "$RUNNER_TEMP/target" rev-parse refs/remotes/origin/malenia-pr)"
          if [ "$actual_head" != "$HEAD_SHA" ]; then
            echo 'PR head changed while preparing the run; restart with the updated PR revision' >&2
            exit 1
          fi
          git -C "$RUNNER_TEMP/target" checkout --detach "$HEAD_SHA"

      - name: Set up Go for Malenia source build
        if: inputs.source_build
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Malenia binary from source
        if: inputs.source_build
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/malenia" ./cmd/malenia
          "$RUNNER_TEMP/malenia" version

      - name: Install prebuilt Malenia release
        if: ${{ !inputs.source_build }}
        env:
          MALENIA_VERSION: ${{ inputs.malenia_version }}
        run: |
          set -euo pipefail
          if [[ "$MALENIA_VERSION" == "latest" ]]; then
            base_url="https://github.com/Malenia-org/Malenia/releases/latest/download"
          elif [[ "$MALENIA_VERSION" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            base_url="https://github.com/Malenia-org/Malenia/releases/download/$MALENIA_VERSION"
          else
            echo 'malenia_version must be latest or a release tag beginning with v' >&2
            exit 2
          fi
          asset=malenia_linux_amd64
          curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/malenia"
          curl -fsSL "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/malenia.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" malenia.SHA256SUMS | sed "s/$asset/malenia/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/malenia"
          "$RUNNER_TEMP/malenia" version

      - name: Resolve target Go version
        id: target-go
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/target/go.mod" ]]; then
            version="$(sed -nE 's/^go[[:space:]]+([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' \
              "$RUNNER_TEMP/target/go.mod" | head -n 1)"
            if [[ -n "$version" ]]; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Go for target repository
        if: steps.target-go.outputs.version != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.target-go.outputs.version }}
          cache: true
          cache-dependency-path: ${{ runner.temp }}/target/go.sum

      - name: Diagnose PR
        id: diagnose
        env:
          MALENIA_COMMAND: ${{ inputs.test_command }}
          MALENIA_BASE: ${{ steps.pr.outputs.base_sha }}
          MALENIA_ATTEMPTS: ${{ inputs.attempts }}
          MALENIA_MAX_PROBES: ${{ inputs.max_probes }}
          MALENIA_DOCKER_IMAGE: ${{ inputs.docker_image }}
          MALENIA_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          MALENIA_INVESTIGATION_TIMEOUT_SECONDS: ${{ inputs.investigation_timeout_seconds }}
          MALENIA_CI_PROVIDER: ${{ steps.evidence.outputs.provider }}
          MALENIA_CI_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          MALENIA_CI_PR_NUMBER: ${{ inputs.pull_request }}
          MALENIA_CI_SOURCE_URL: ${{ steps.evidence.outputs.source_url }}
          EVIDENCE_BOUNDED_LOG_PATH: ${{ steps.evidence.outputs.bounded_log_path }}
          EVIDENCE_ARTIFACT_DIR: ${{ steps.evidence.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          if [[ ! "$MALENIA_ATTEMPTS" =~ ^[1-5]$ ]]; then
            echo 'attempts must be between 1 and 5' >&2
            exit 2
          fi
          if [[ ! "$MALENIA_MAX_PROBES" =~ ^[1-6]$ ]]; then
            echo 'max_probes must be between 1 and 6' >&2
            exit 2
          fi
          if [[ ! "$MALENIA_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo 'timeout_seconds must be a positive integer' >&2
            exit 2
          fi
          if [[ ! "$MALENIA_INVESTIGATION_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo 'investigation_timeout_seconds must be a positive integer' >&2
            exit 2
          fi
          args=(diagnose --repo "$RUNNER_TEMP/target" --command "$MALENIA_COMMAND"
            --base "$MALENIA_BASE" --attempts "$MALENIA_ATTEMPTS"
            --max-probes "$MALENIA_MAX_PROBES"
            --timeout "${MALENIA_TIMEOUT_SECONDS}s"
            --investigation-timeout "${MALENIA_INVESTIGATION_TIMEOUT_SECONDS}s"
            --json
            --bundle "$RUNNER_TEMP/malenia-bundle")
          evidence_mode=false
          if [ "${{ steps.evidence.outputs.available }}" = "true" ]; then
            evidence_mode=true
            args+=(--ci-log "$EVIDENCE_BOUNDED_LOG_PATH" \
              --artifact-dir "$EVIDENCE_ARTIFACT_DIR" --artifact-first)
            junit="$(find "$EVIDENCE_ARTIFACT_DIR" -type f \( -iname '*.xml' -o -iname '*.junit' \) -print -quit)"
            if [ -n "$junit" ]; then
              args+=(--junit "$junit")
            fi
          elif [ "${{ inputs.allow_reproduction_fallback }}" != "true" ]; then
            echo "Original CI evidence was not found; refusing to run a fresh reproduction." >&2
            exit 2
          fi
          if [ "$evidence_mode" != "true" ] && [ "${{ inputs.skip_adaptive }}" = "true" ]; then
            args+=(--skip-adaptive)
          fi
          if [ "$evidence_mode" != "true" ] && [ "${{ inputs.fast_path }}" = "true" ]; then
            args+=(--fast-path)
          fi
          if [ "${{ inputs.repair }}" = "true" ]; then
            args+=(--repair)
          fi
          if [ -n "$MALENIA_DOCKER_IMAGE" ]; then
            args+=(--executor docker --image "$MALENIA_DOCKER_IMAGE")
          fi
          outer_timeout=$((MALENIA_INVESTIGATION_TIMEOUT_SECONDS + 30))
          timeout --signal=TERM --kill-after=15s "${outer_timeout}s" \
            "$RUNNER_TEMP/malenia" "${args[@]}" > "$RUNNER_TEMP/malenia-report.json"

      - name: Write run summary
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          SOURCE_URL: ${{ steps.evidence.outputs.source_url }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PULL_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/malenia-report.json"
          {
            echo "## Malenia test: [$TARGET_REPOSITORY#$PULL_NUMBER]($PR_URL)"
            echo
            echo "**Classification:** $(jq -r '.classification // "unknown"' "$report")"
            echo
            if [ "${{ steps.evidence.outputs.available }}" = "true" ]; then
              echo "**Evidence-first:** analyzed original ${{ steps.evidence.outputs.provider }} CI evidence without local reproduction"
              if [ -n "${{ steps.evidence.outputs.source_url }}" ]; then
                echo
                echo "Source check: ${{ steps.evidence.outputs.source_url }}"
              fi
            else
              echo "**Reproduced:** $(jq -r '(.baseline.failures // 0|tostring) + "/" + (.baseline.attempts // 0|tostring)' "$report") attempts failed"
            fi
            echo
            primary="$(jq -r '
              . as $report
              | $report.findings[]?
              | select(.kind == "incident_diagnosis") as $finding
              | ($report.failure_incidents[]? | select(("finding:" + .id) == $finding.id)) as $incident
              | "### " + ($incident.category // "Observed incident")
                + "\n\n**Affected tests:** " + (($incident.affected_tests // []) | join(", "))
                + "\n\n**Observed locations:** "
                + (($incident.observed_locations // []) | map((.access // "access") + ": `" + (.file // "unknown") + ":" + ((.line // 0)|tostring) + "`" + (if .function then " (" + .function + ")" else "" end)) | join("; "))
                + "\n\n" + ($finding.statement // $incident.observed_explanation // "Observed incident evidence preserved.")
                + "\n\n**Relevant code:** " + ($incident.proposed_explanation // "No mechanism established.")
                + "\n\n**PR relationship:** " + ($incident.pr_relationship // "Not established.")
                + "\n\n**Evidence IDs:** " + (($finding.evidence_ids // $incident.evidence_ids // []) | join(", "))
                + "\n\n**Root cause assessment:** " + (($report.root_cause.status // "unknown") + ": " + ($report.root_cause.statement // "not established") + "; causality=" + ($report.root_cause.causality_status // "unverified") + "; verification=" + ($report.root_cause.verification_status // "not_attempted"))
                + "\n\n**Confidence:** observed=" + (($incident.observed_confidence // 0)|tostring) + ", explanation=" + (($incident.explanation_confidence // 0)|tostring) + ", causality=" + (($incident.causality_confidence // 0)|tostring)' "$report" 2>/dev/null || true)"
            if [ -n "$primary" ]; then
              echo '**Primary diagnosis:**'
              echo "$primary"
              if [ -n "$SOURCE_URL" ]; then
                echo
                echo "**Original CI evidence:** $SOURCE_URL"
              fi
              echo
            fi
            files="$(jq -r '(.localization.likely_file_reasons // {}) | to_entries[]? | "- `" + .key + "` — " + ((.value // []) | join(", "))' "$report")"
            if [ -n "$files" ]; then
              echo '**Likely files:**'
              echo "$files"
              echo
            fi
            hypotheses="$(jq -r '
              .hypotheses[]?
              | select((.statement // "") != "")
              | select((.supporting_evidence_ids // []) | length > 0)
              | select((.contradicting_evidence_ids // []) | length > 0)
              | select((.predicted_observations // []) | length > 0)
              | select(((.statement // "") | startswith("Candidate location ")) | not)
              | "- " + .statement
                + " (supporting: " + ((.supporting_evidence_ids // []) | join(", "))
                + "; contradicting: " + ((.contradicting_evidence_ids // []) | join(", "))
                + "; distinguishes: " + ((.predicted_observations // []) | join("; ")) + ")"
            ' "$report" 2>/dev/null || true)"
            if [ -n "$hypotheses" ]; then
              echo '**Causal hypotheses:**'
              echo "$hypotheses"
              echo
            fi
            repair_summary="$(jq -r '
              if .repair then
                "**Status:** " + (.repair.status // "unknown")
                + (if .repair.patch_id then "\n\n**Patch:** `" + .repair.patch_id + "`\n\n**Verification:** " + (.repair.verification_status // "not attempted") else "" end)
                + (if ((.repair.changed_files // []) | length) > 0 then "\n\n**Changed files:** " + ((.repair.changed_files // []) | join(", ")) else "" end)
                + (if ((.repair.limitations // []) | length) > 0 then "\n\n**Limitations:** " + ((.repair.limitations // []) | join("; ")) else "" end)
              else empty end
            ' "$report" 2>/dev/null || true)"
            if [ -n "$repair_summary" ]; then
              echo '**Repair and verification:**'
              echo "$repair_summary"
              echo
            fi
            episodes="$(jq -r '.failure_episodes[]? | "- **" + (.test_identifier // "unknown failure") + "** — " + (.failure_message // "observed CI failure")' "$report" 2>/dev/null || true)"
            if [ -n "$episodes" ]; then
              echo '**Failure episodes:**'
              echo "$episodes"
              echo
            fi
            candidates="$(jq -r '.candidates[0:12][]? | "- **" + (.location.symbol_identity // "unresolved location") + "** (`" + (.location.file_path // "unknown") + ":" + ((.location.start_line // 0)|tostring) + "`, " + (if .location.provenance == "enclosing_symbol" then "enclosing symbol" elif .location.provenance == "inferred_caller" then "inferred structural candidate" elif .location.provenance == "dependency" then "dependency candidate" elif .location.provenance == "direct_stack_frame" then "directly observed location" else (.location.provenance // .location.location_type // "unattributed") end) + "; execution=" + ((.score.execution_relevance // 0)|tostring) + ")"' "$report" 2>/dev/null || true)"
            if [ -n "$candidates" ]; then
              echo '**Supporting candidate locations:**'
              echo "$candidates"
              echo
            fi
            races="$(jq -r '.race_reports[]? | "- race read: " + ((.read_stack[0].file // "unknown") + ":" + ((.read_stack[0].line // 0)|tostring)) + "; write: " + ((.write_stack[0].file // "unknown") + ":" + ((.write_stack[0].line // 0)|tostring))' "$report" 2>/dev/null || true)"
            if [ -n "$races" ]; then
              echo '**Race evidence:**'
              echo "$races"
              echo
            fi
            if [ "${{ steps.evidence.outputs.available }}" = "true" ]; then
              echo 'The source CI log, downloaded artifacts, and JSON report are attached as the workflow artifact.'
            else
              echo 'The JSON report and reproduction bundle are attached as the workflow artifact.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnosis report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malenia-pr-diagnosis-${{ steps.pr.outputs.artifact_slug }}-${{ inputs.pull_request }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/malenia-report.json
            ${{ runner.temp }}/malenia-bundle
            ${{ runner.temp }}/source-ci-bounded.log
            ${{ runner.temp }}/source-evidence-status.txt
            ${{ runner.temp }}/source-artifacts
          if-no-files-found: warn
          retention-days: 14
