name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish cypher binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build linux/amd64 binary
        run: |
          set -euo pipefail
          mkdir -p dist
          # The sqlite-backed event store needs cgo, so the binary is built on
          # the same linux/amd64 platform that GitHub runners use.
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/cypher_linux_amd64 ./cmd/cypher
          (cd dist && sha256sum cypher_linux_amd64 > SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
