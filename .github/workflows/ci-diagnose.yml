name: Malenia Diagnose

# Reusable workflow. Call it from a job in another repository:
#
#   jobs:
#     malenia:
#       if: github.event.workflow_run.conclusion == 'failure'
#       permissions:
#         actions: read
#         contents: read
#         pull-requests: write
#       uses: causent/malenia/.github/workflows/ci-diagnose.yml@v1
#       with:
#         run_id: ${{ github.event.workflow_run.id }}
#         head_sha: ${{ github.event.workflow_run.head_sha }}
#
# The target repository supplies the source code, the failing command (through
# .malenia.yml or the `command` input), and its runtime. Malenia supplies the
# diagnosis engine.

on:
  workflow_call:
    inputs:
      command:
        description: Failing command; overrides command in .malenia.yml
        type: string
        required: false
        default: ''
      head_sha:
        description: Commit to diagnose; defaults to the checked-out commit
        type: string
        required: false
        default: ''
      base_sha:
        description: Exact base commit; wins over base_ref
        type: string
        required: false
        default: ''
      base_ref:
        description: Base revision or ref; defaults to merge-base with the default branch
        type: string
        required: false
        default: ''
      run_id:
        description: Failed workflow run id whose logs should be collected
        type: string
        required: false
        default: ''
      attempts:
        description: Reproduction attempts; overrides attempts in .malenia.yml
        type: string
        required: false
        default: ''
      docker_image:
        description: Docker image for the docker executor; overrides image in .malenia.yml
        type: string
        required: false
        default: ''
      agent:
        description: Ask the configured model gateway to analyze the collected evidence
        type: boolean
        required: false
        default: false
      malenia_version:
        description: Malenia release tag to install, or "latest"
        type: string
        required: false
        default: v3
      malenia_repository:
        description: Repository that publishes Malenia releases
        type: string
        required: false
        default: Malenia-org/Malenia
      comment:
        description: Post the diagnosis as a pull request comment when the run belongs to a PR
        type: boolean
        required: false
        default: true
    secrets:
      MALENIA_GATEWAY_ENDPOINT:
        required: false
      MALENIA_GATEWAY_MODEL:
        required: false
    outputs:
      classification:
        description: Deterministic classification of the failure
        value: ${{ jobs.diagnose.outputs.classification }}
      refused:
        description: Whether Malenia refused to classify the failure
        value: ${{ jobs.diagnose.outputs.refused }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  diagnose:
    name: Diagnose failure
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.diagnose.outputs.classification }}
      refused: ${{ steps.diagnose.outputs.refused }}
      pr: ${{ steps.revisions.outputs.pr }}
    steps:
      - name: Checkout failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          set -euo pipefail
          head="$INPUT_HEAD_SHA"
          if [ -z "$head" ]; then
            head="$(git rev-parse HEAD)"
          fi
          git checkout --force --detach "$head"

          base="$INPUT_BASE_SHA"
          if [ -z "$base" ]; then
            if [ -n "$EVENT_PR_NUMBER" ]; then
              base="$EVENT_PR_BASE_SHA"
              if [ -z "$base" ]; then
                echo "pull request base SHA is missing" >&2
                exit 1
              fi
            fi
          fi
          if [ -z "$base" ]; then
            ref="$INPUT_BASE_REF"
            if [ -z "$ref" ]; then
              ref="origin/${{ github.event.repository.default_branch || 'main' }}"
            fi
            fetch_ref="${ref#origin/}"
            git fetch --no-tags origin "$fetch_ref" || true
            base="$(git merge-base HEAD "$ref" 2>/dev/null || true)"
          fi

          pr="$EVENT_PR_NUMBER"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            pr="${{ github.event.pull_request.number }}"
          fi
          if [ "$pr" = "null" ]; then
            pr=""
          fi

          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Collect failed job logs
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          raw_log="$RUNNER_TEMP/malenia-failed.raw.log"
          gh run view "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --log-failed > "$raw_log" 2>&1 || true
          # Keep original CI evidence bounded and remove common credential-shaped
          # values before it reaches an artifact or the diagnosis process.
          sed -E \
            -e 's/(authorization:[[:space:]]*bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(authorization:[[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/((token|password|secret|api[_-]?key)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16})/[REDACTED]/g' \
            "$raw_log" | head -c 262144 > "$RUNNER_TEMP/malenia-failed.log" || true
          gh run view "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.name) (\(.databaseId))"' \
            > "$RUNNER_TEMP/malenia-failed-jobs.txt" 2>&1 || true
          mkdir -p "$RUNNER_TEMP/malenia-artifacts"
          gh run download "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --dir "$RUNNER_TEMP/malenia-artifacts" || true

      - name: Install malenia
        env:
          INPUT_VERSION: ${{ inputs.malenia_version }}
          INPUT_REPOSITORY: ${{ inputs.malenia_repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          repository="$INPUT_REPOSITORY"
          if [[ ! "$version" =~ ^(latest|v[0-9A-Za-z._-]+)$ ]]; then
            echo "invalid malenia_version" >&2
            exit 2
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid malenia_repository" >&2
            exit 2
          fi
          if [ "$version" = "latest" ]; then
            base_url="https://github.com/$repository/releases/latest/download"
          else
            base_url="https://github.com/$repository/releases/download/$version"
          fi
          asset=malenia_linux_amd64
          if ! curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/malenia"; then
            asset=causent_linux_amd64
            curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/malenia"
          fi
          curl -fsSL "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/malenia.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" malenia.SHA256SUMS | sed "s/$asset/malenia/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/malenia"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/malenia" version

      - name: Set up Go
        if: inputs.docker_image == '' && hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Diagnose
        id: diagnose
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_ATTEMPTS: ${{ inputs.attempts }}
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_BASE: ${{ steps.revisions.outputs.base }}
          MALENIA_CI_PROVIDER: github-actions
          MALENIA_CI_RUN_ID: ${{ inputs.run_id }}
          MALENIA_CI_PR_NUMBER: ${{ steps.revisions.outputs.pr }}
          MALENIA_CI_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
          INPUT_CI_LOG: ${{ runner.temp }}/malenia-failed.log
          INPUT_ARTIFACT_DIR: ${{ runner.temp }}/malenia-artifacts
        run: |
          set -euo pipefail
          args=(diagnose --repo . --json --bundle "$RUNNER_TEMP/malenia-bundle")

          if [ -n "$INPUT_COMMAND" ]; then
            args+=(--command "$INPUT_COMMAND")
          fi
          if [ -n "$INPUT_BASE" ]; then
            args+=(--base "$INPUT_BASE")
          fi
          if [ -s "$INPUT_CI_LOG" ]; then
            args+=(--ci-log "$INPUT_CI_LOG")
          fi
          if [ -d "$INPUT_ARTIFACT_DIR" ]; then
            args+=(--artifact-dir "$INPUT_ARTIFACT_DIR" --artifact-first)
          fi
          if [ -n "$INPUT_ATTEMPTS" ]; then
            args+=(--attempts "$INPUT_ATTEMPTS")
          fi
          if [ -n "$INPUT_DOCKER_IMAGE" ]; then
            args+=(--executor docker --image "$INPUT_DOCKER_IMAGE")
          fi
          status=0
          malenia "${args[@]}" > "$RUNNER_TEMP/malenia-report.json" \
            2> "$RUNNER_TEMP/malenia-stderr.log" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if ! jq -e . "$RUNNER_TEMP/malenia-report.json" > /dev/null 2>&1; then
            {
              echo "## Malenia diagnosis"
              echo
              echo "Malenia did not produce a report (exit $status)."
              echo
              echo '```'
              tail -50 "$RUNNER_TEMP/malenia-stderr.log"
              echo '```'
            } > "$RUNNER_TEMP/malenia-summary.md"
            cat "$RUNNER_TEMP/malenia-summary.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          classification="$(jq -r '.classification // "unknown"' "$RUNNER_TEMP/malenia-report.json")"
          refused="$(jq -r '.refused // false' "$RUNNER_TEMP/malenia-report.json")"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "refused=$refused" >> "$GITHUB_OUTPUT"

          {
            echo "## Malenia diagnosis"
            echo
            echo "**Classification**: \`$classification\`"
            echo
            jq -r '
              (if .baseline.source == "ci_artifact" then
                "**Evidence**: \(.baseline.failures) failure observation(s) from existing CI artifacts; no local reproduction  "
              else
                "**Reproduced**: \(.baseline.failures)/\(.baseline.attempts) attempts failed  "
              end),
              "**Confidence**: \(.confidence)  ",
              (if .comparison then
                "**Base/head**: base \(.comparison.base.failures)/\(.comparison.base.attempts), head \(.comparison.head.failures)/\(.comparison.head.attempts) → `\(.comparison.verdict)`  "
              else empty end),
              (if .comparison then
                (if .comparison.verdict == "real_regression" then
                  "**PR relationship**: the head failed while the base passed; the PR is implicated by controlled comparison  "
                elif .comparison.verdict == "pre_existing_failure" then
                  "**PR relationship**: the same command failed on the base; the failure is pre-existing  "
                else
                  "**PR relationship**: base/head evidence is not sufficient to attribute the failure to this PR  "
                end)
              else empty end),
              (if .localization.first_known_bad then
                "**First known bad**: `\(.localization.first_known_bad)`  "
              else empty end),
              (if .refused then "**Refused**: \(.refusal_reason)  " else empty end),
              "",
              (if ((.findings // []) | map(select(.kind == "incident_diagnosis")) | length) > 0 then
                "**Primary diagnosis**:\n" + ((.findings // []) | map(select(.kind == "incident_diagnosis") | "- " + .statement) | join("\n"))
              else empty end),
              (if ((.failure_incidents // []) | length) > 0 then
                "**Observed incident locations**:\n" + ((.failure_incidents // []) | map(.observed_locations // [] | map("- " + (.access // "access") + " `" + (.file // "unknown") + ":" + ((.line // 0)|tostring) + "` (" + (.provenance // "unknown provenance") + ")") | join("\n")) | join("\n"))
              else empty end),
              (if ((.candidates // []) | length) > 0 then
                "**Supporting candidate locations**:\n" + ((.candidates[0:8] // []) | map("- `" + (.location.file_path // "unknown") + ":" + ((.location.start_line // 0)|tostring) + "` — " + (.location.symbol_identity // "unresolved") + " (" + (if .location.provenance == "enclosing_symbol" then "enclosing symbol" elif .location.provenance == "inferred_caller" then "inferred structural candidate" elif .location.provenance == "direct_stack_frame" then "directly observed location" else (.location.provenance // "unattributed") end) + ")") | join("\n"))
              else empty end),
              (if ((.root_cause.statement // "") != "") then
                "**Root cause**: [" + (.root_cause.status // "unknown") + "] " + .root_cause.statement + "\n**Causality**: " + (.root_cause.causality_status // "unverified") + "; verification: " + (.root_cause.verification_status // "not_attempted")
              else empty end),
              (if ((.failure_episodes // []) | length) > 0 then
                "**Failure episodes**:\n" + ((.failure_episodes[0:12] // []) | map("- **" + (.test_identifier // "unknown test") + "** — " + (.failure_type // "observed failure") + ": " + (.failure_message // "no message")) | join("\n"))
              else empty end),
              (if ((.race_reports // []) | length) > 0 then
                "**Race evidence**:\n" + ((.race_reports[0:5] // []) | map("- " + (.test // "unknown test") + ": read " + ((.read_stack[0].file // "unknown") + ":" + ((.read_stack[0].line // 0)|tostring)) + "; write " + ((.write_stack[0].file // "unknown") + ":" + ((.write_stack[0].line // 0)|tostring))) | join("\n"))
              else empty end),
              (if ((.candidates // []) | length) > 0 then
                "**Inspected source candidates**:\n" + ((.candidates[0:5] // []) | map("- `" + (.location.file_path // "unknown") + ":" + ((.location.start_line // 0)|tostring) + "` — " + (.location.symbol_identity // "unresolved") + " (" + (.location.provenance // .location.location_type // "unattributed") + "; execution=" + ((.score.execution_relevance // 0)|tostring) + ")") | join("\n"))
              else empty end),
              (if ((.execution_paths // []) | length) > 0 then
                "**Static call paths (inferred, not observed runtime paths)**:\n" + ((.execution_paths[0:5] // []) | map("- [" + (.status // "inferred") + "] " + .summary) | join("\n"))
              else empty end),
              "",
              (if ((.hypotheses // []) | map(select((.statement // "") != "" and ((.supporting_evidence_ids // []) | length) > 0 and ((.contradicting_evidence_ids // []) | length) > 0 and ((.predicted_observations // []) | length) > 0)) | length) > 0 then
                "**Causal hypotheses**:\n" + ((.hypotheses // []) | map(select((.statement // "") != "" and ((.supporting_evidence_ids // []) | length) > 0 and ((.contradicting_evidence_ids // []) | length) > 0 and ((.predicted_observations // []) | length) > 0) | "- " + .statement) | join("\n"))
              else empty end),
              "",
              (if ((.uncertainty // []) | length) > 0 then
                "**Uncertainty**:\n" + ((.uncertainty // []) | map("- \(.)") | join("\n"))
              else empty end)
            ' "$RUNNER_TEMP/malenia-report.json"
            echo
            echo "Bundle: \`$(jq -r '.bundle_path // "not written"' "$RUNNER_TEMP/malenia-report.json")\`"
          } > "$RUNNER_TEMP/malenia-summary.md"
          cat "$RUNNER_TEMP/malenia-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnosis bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malenia-diagnosis-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/malenia-report.json
            ${{ runner.temp }}/malenia-summary.md
            ${{ runner.temp }}/malenia-stderr.log
            ${{ runner.temp }}/malenia-failed.log
            ${{ runner.temp }}/malenia-failed-jobs.txt
            ${{ runner.temp }}/malenia-artifacts
            ${{ runner.temp }}/malenia-bundle
          if-no-files-found: ignore

  analyze:
    name: Optional model analysis
    needs: diagnose
    if: needs.diagnose.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download deterministic diagnosis
        uses: actions/download-artifact@v4
        with:
          name: malenia-diagnosis-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/malenia-raw

      - name: Install malenia
        env:
          INPUT_VERSION: ${{ inputs.malenia_version }}
          INPUT_REPOSITORY: ${{ inputs.malenia_repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          repository="$INPUT_REPOSITORY"
          if [[ ! "$version" =~ ^(latest|v[0-9A-Za-z._-]+)$ ]]; then
            echo "invalid malenia_version" >&2
            exit 2
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid malenia_repository" >&2
            exit 2
          fi
          if [ "$version" = "latest" ]; then
            base_url="https://github.com/$repository/releases/latest/download"
          else
            base_url="https://github.com/$repository/releases/download/$version"
          fi
          asset=malenia_linux_amd64
          if ! curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/malenia"; then
            asset=causent_linux_amd64
            curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/malenia"
          fi
          curl -fsSL "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/malenia.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" malenia.SHA256SUMS | sed "s/$asset/malenia/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/malenia"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/malenia" version

      - name: Preserve deterministic report
        if: inputs.agent == false
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/malenia-final"
          cp "$RUNNER_TEMP/malenia-raw/malenia-report.json" "$RUNNER_TEMP/malenia-final/malenia-report.json"

      - name: Analyze validated diagnosis
        if: inputs.agent == true
        env:
          MALENIA_GATEWAY_ENDPOINT: ${{ secrets.MALENIA_GATEWAY_ENDPOINT }}
          MALENIA_GATEWAY_MODEL: ${{ secrets.MALENIA_GATEWAY_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "$MALENIA_GATEWAY_ENDPOINT" ] || [ -z "$MALENIA_GATEWAY_MODEL" ]; then
            echo "agent=true requires MALENIA_GATEWAY_ENDPOINT and MALENIA_GATEWAY_MODEL secrets" >&2
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/malenia-final"
          malenia analyze \
            --report "$RUNNER_TEMP/malenia-raw/malenia-report.json" \
            --output "$RUNNER_TEMP/malenia-final/malenia-report.json"

      - name: Copy evidence artifacts
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/malenia-raw/malenia-summary.md" "$RUNNER_TEMP/malenia-final/malenia-summary.md" || true
          cp "$RUNNER_TEMP/malenia-raw/malenia-stderr.log" "$RUNNER_TEMP/malenia-final/malenia-stderr.log" || true
          cp "$RUNNER_TEMP/malenia-raw/malenia-failed.log" "$RUNNER_TEMP/malenia-final/malenia-failed.log" || true
          cp "$RUNNER_TEMP/malenia-raw/malenia-failed-jobs.txt" "$RUNNER_TEMP/malenia-final/malenia-failed-jobs.txt" || true
          cp -R "$RUNNER_TEMP/malenia-raw/malenia-bundle" "$RUNNER_TEMP/malenia-final/malenia-bundle" || true

      - name: Upload final diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: malenia-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/malenia-final
          if-no-files-found: error

  publish:
    name: Publish diagnosis
    needs: [diagnose, analyze]
    if: needs.analyze.result == 'success' && inputs.comment && needs.diagnose.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download diagnosis result
        uses: actions/download-artifact@v4
        with:
          name: malenia-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/malenia-result

      - name: Prepare bounded diagnosis comment
        env:
          PR_NUMBER: ${{ needs.diagnose.outputs.pr }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/malenia-result/malenia-report.json"
          test -s "$report"
          classification="$(jq -r '.classification // "unknown"' "$report")"
          refused="$(jq -r '.refused // false' "$report")"
          failures="$(jq -r '.baseline.failures // 0' "$report")"
          attempts="$(jq -r '.baseline.attempts // 0' "$report")"
          command="$(jq -r 'if (.command | type) == "array" then (.command | join(" ")) else (.command // "not configured") end' "$report")"
          base_passes="$(jq -r '.comparison.base.passes // 0' "$report")"
          base_attempts="$(jq -r '.comparison.base.attempts // 0' "$report")"
          locations="$(jq -r '(.failure_incidents // []) | map(.observed_locations // [] | map((.access // "access") + " " + (.file // "unknown") + ":" + ((.line // 0)|tostring) + " (" + (.provenance // "unknown provenance") + ")") | join("; ")) | join("\n")' "$report")"
          candidates="$(jq -r '(.candidates[0:5] // []) | map((.location.file_path // "unknown") + ":" + ((.location.start_line // 0)|tostring) + " (" + (.location.provenance // "unattributed") + ")") | join("; ")' "$report")"
          groups="$(jq -r '(.failure_groups // []) | if length == 0 then "none recorded" else map("\(.status): \(.failure_ids | join(", "))") | join("; ") end' "$report")"
          episodes="$(jq -r '(.failure_episodes // []) | if length == 0 then "none recorded" else map((.test_identifier // "unknown test") + ": " + (.failure_message // "")) | .[0:10] | join("; ") end' "$report")"
          incidents="$(jq -r '(.failure_incidents // []) | if length == 0 then "none recorded" else map((.category // "failure") + " — tests: " + ((.affected_tests // []) | join(", ")) + "; " + (.observed_explanation // "") + "; PR: " + (.pr_relationship // "not established")) | join("\n") end' "$report")"
          hypotheses="$(jq -r '(.hypotheses // []) | map(select((.statement // "") != "" and ((.supporting_evidence_ids // []) | length) > 0 and ((.contradicting_evidence_ids // []) | length) > 0 and ((.predicted_observations // []) | length) > 0) | "[\(.status)] \(.statement)") | if length == 0 then "no causal hypothesis established" else .[0:3] | join("; ") end' "$report")"
          paths="$(jq -r '(.execution_paths // []) | if length == 0 then "none reconstructed" else map("[" + (.status // "inferred") + "] " + .summary) | .[0:3] | join("; ") end' "$report")"
          finding="$(jq -r '(.findings // []) | map(select(.kind == "incident_diagnosis") | .statement) | .[0] // "no primary incident finding"' "$report")"
          root_cause="$(jq -r '(.root_cause // {}) | ((.status // "unknown") + ": " + (.statement // "not established") + "; causality=" + (.causality_status // "unverified") + "; verification=" + (.verification_status // "not_attempted"))' "$report")"
          confidence="$(jq -r '((.confidence // 0) * 100 | floor | tostring) + "%"' "$report")"
          failure="$(jq -r '.baseline.results[0].stderr_excerpt // ""' "$report" | grep -E -- '--- FAIL:|^FAIL' | head -3 | tr '\n' ' ' || true)"
          artifact_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(cat <<EOF
          ## Malenia diagnosis

          **Classification:** ${classification}<br>
          **Confidence:** ${confidence}<br>
          **Command:** ${command}

          **Reproduction:** ${failures}/${attempts} head attempts failed; ${base_passes}/${base_attempts} base attempts passed.
          **Refused:** ${refused}

          **Primary diagnosis:** ${finding}
          **Observed locations:** ${locations:-not recorded}<br>
          **Supporting candidates:** ${candidates:-none recorded}

          **Failure groups:** ${groups}

          **Failed tests/episodes:** ${episodes}

          **Failure incident:** ${incidents}

          **Root cause assessment:** ${root_cause}

          **Hypotheses:** ${hypotheses}

          **Execution paths:** ${paths}

          **Observed failure:** ${failure:-No failure line extracted}

          **Uncertainty:** Review the full evidence before treating the localization as a confirmed root cause.

          [View workflow run and diagnosis artifact](${artifact_url})
          EOF
          )
          printf '%s\n' "$body" > "$RUNNER_TEMP/malenia-comment.md"

      - name: Publish bounded diagnosis comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.diagnose.outputs.pr }}
          COMMENT_PATH: ${{ runner.temp }}/malenia-comment.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const issueNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- malenia-diagnosis -->';
            const markedBody = `${marker}\n${body}`;
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              throw new Error(`Invalid pull request number: ${process.env.PR_NUMBER}`);
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker)
              );
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: markedBody,
              };
              if (existing) {
                await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
              } else {
                await github.rest.issues.createComment(payload);
              }
            } catch (error) {
              core.setFailed(`Unable to publish diagnosis comment: ${error.status ?? 'unknown'} ${error.message}`);
            }
