name: Causent Diagnose

# Reusable workflow. Call it from a job in another repository:
#
#   jobs:
#     causent:
#       if: github.event.workflow_run.conclusion == 'failure'
#       permissions:
#         actions: read
#         contents: read
#         pull-requests: write
#       uses: causent/causent/.github/workflows/ci-diagnose.yml@v1
#       with:
#         run_id: ${{ github.event.workflow_run.id }}
#         head_sha: ${{ github.event.workflow_run.head_sha }}
#
# The target repository supplies the source code, the failing command (through
# .causent.yml or the `command` input), and its runtime. Causent supplies the
# diagnosis engine.

on:
  workflow_call:
    inputs:
      command:
        description: Failing command; overrides command in .causent.yml
        type: string
        required: false
        default: ''
      head_sha:
        description: Commit to diagnose; defaults to the checked-out commit
        type: string
        required: false
        default: ''
      base_sha:
        description: Exact base commit; wins over base_ref
        type: string
        required: false
        default: ''
      base_ref:
        description: Base revision or ref; defaults to merge-base with the default branch
        type: string
        required: false
        default: ''
      run_id:
        description: Failed workflow run id whose logs should be collected
        type: string
        required: false
        default: ''
      attempts:
        description: Reproduction attempts; overrides attempts in .causent.yml
        type: string
        required: false
        default: ''
      docker_image:
        description: Docker image for the docker executor; overrides image in .causent.yml
        type: string
        required: false
        default: ''
      agent:
        description: Ask the configured model gateway to analyze the collected evidence
        type: boolean
        required: false
        default: false
      causent_version:
        description: Causent release tag to install, or "latest"
        type: string
        required: false
        default: latest
      causent_repository:
        description: Repository that publishes Causent releases
        type: string
        required: false
        default: causent/causent
      comment:
        description: Post the diagnosis as a pull request comment when the run belongs to a PR
        type: boolean
        required: false
        default: true
    secrets:
      CAUSENT_GATEWAY_ENDPOINT:
        required: false
      CAUSENT_GATEWAY_MODEL:
        required: false
    outputs:
      classification:
        description: Deterministic classification of the failure
        value: ${{ jobs.diagnose.outputs.classification }}
      refused:
        description: Whether Causent refused to classify the failure
        value: ${{ jobs.diagnose.outputs.refused }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  diagnose:
    name: Diagnose failure
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.diagnose.outputs.classification }}
      refused: ${{ steps.diagnose.outputs.refused }}
      pr: ${{ steps.revisions.outputs.pr }}
    steps:
      - name: Checkout failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          set -euo pipefail
          head="$INPUT_HEAD_SHA"
          if [ -z "$head" ]; then
            head="$(git rev-parse HEAD)"
          fi
          git checkout --force --detach "$head"

          base="$INPUT_BASE_SHA"
          if [ -z "$base" ]; then
            if [ -n "$EVENT_PR_NUMBER" ]; then
              base="$EVENT_PR_BASE_SHA"
              if [ -z "$base" ]; then
                echo "pull request base SHA is missing" >&2
                exit 1
              fi
            fi
          fi
          if [ -z "$base" ]; then
            ref="$INPUT_BASE_REF"
            if [ -z "$ref" ]; then
              ref="origin/${{ github.event.repository.default_branch || 'main' }}"
            fi
            fetch_ref="${ref#origin/}"
            git fetch --no-tags origin "$fetch_ref" || true
            base="$(git merge-base HEAD "$ref" 2>/dev/null || true)"
          fi

          pr="$EVENT_PR_NUMBER"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            pr="${{ github.event.pull_request.number }}"
          fi
          if [ "$pr" = "null" ]; then
            pr=""
          fi

          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Collect failed job logs
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          raw_log="$RUNNER_TEMP/causent-failed.raw.log"
          gh run view "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --log-failed > "$raw_log" 2>&1 || true
          # Keep original CI evidence bounded and remove common credential-shaped
          # values before it reaches an artifact or the diagnosis process.
          sed -E \
            -e 's/(authorization:[[:space:]]*bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(authorization:[[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/((token|password|secret|api[_-]?key)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16})/[REDACTED]/g' \
            "$raw_log" | head -c 262144 > "$RUNNER_TEMP/causent-failed.log" || true
          gh run view "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.name) (\(.databaseId))"' \
            > "$RUNNER_TEMP/causent-failed-jobs.txt" 2>&1 || true

      - name: Install causent
        env:
          INPUT_VERSION: ${{ inputs.causent_version }}
          INPUT_REPOSITORY: ${{ inputs.causent_repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          repository="$INPUT_REPOSITORY"
          if [[ ! "$version" =~ ^(latest|v[0-9A-Za-z._-]+)$ ]]; then
            echo "invalid causent_version" >&2
            exit 2
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid causent_repository" >&2
            exit 2
          fi
          if [ "$version" = "latest" ]; then
            url="https://github.com/$repository/releases/latest/download/causent_linux_amd64"
          else
            url="https://github.com/$repository/releases/download/$version/causent_linux_amd64"
          fi
          curl -fsSL "$url" -o "$RUNNER_TEMP/causent"
          chmod +x "$RUNNER_TEMP/causent"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/causent" version

      - name: Set up Go
        if: inputs.docker_image == '' && hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Diagnose
        id: diagnose
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_ATTEMPTS: ${{ inputs.attempts }}
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_BASE: ${{ steps.revisions.outputs.base }}
          INPUT_CI_LOG: ${{ runner.temp }}/causent-failed.log
        run: |
          set -euo pipefail
          args=(diagnose --repo . --json --bundle "$RUNNER_TEMP/causent-bundle")

          if [ -n "$INPUT_COMMAND" ]; then
            args+=(--command "$INPUT_COMMAND")
          fi
          if [ -n "$INPUT_BASE" ]; then
            args+=(--base "$INPUT_BASE")
          fi
          if [ -s "$INPUT_CI_LOG" ]; then
            args+=(--ci-log "$INPUT_CI_LOG")
          fi
          if [ -n "$INPUT_ATTEMPTS" ]; then
            args+=(--attempts "$INPUT_ATTEMPTS")
          fi
          if [ -n "$INPUT_DOCKER_IMAGE" ]; then
            args+=(--executor docker --image "$INPUT_DOCKER_IMAGE")
          fi
          # Do not send provider secrets into code checked out from the event.
          # LLM analysis is intentionally disabled in this unprivileged job.

          status=0
          causent "${args[@]}" > "$RUNNER_TEMP/causent-report.json" \
            2> "$RUNNER_TEMP/causent-stderr.log" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if ! jq -e . "$RUNNER_TEMP/causent-report.json" > /dev/null 2>&1; then
            {
              echo "## Causent diagnosis"
              echo
              echo "Causent did not produce a report (exit $status)."
              echo
              echo '```'
              tail -50 "$RUNNER_TEMP/causent-stderr.log"
              echo '```'
            } > "$RUNNER_TEMP/causent-summary.md"
            cat "$RUNNER_TEMP/causent-summary.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          classification="$(jq -r '.classification // "unknown"' "$RUNNER_TEMP/causent-report.json")"
          refused="$(jq -r '.refused // false' "$RUNNER_TEMP/causent-report.json")"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "refused=$refused" >> "$GITHUB_OUTPUT"

          {
            echo "## Causent diagnosis"
            echo
            echo "**Classification**: \`$classification\`"
            echo
            jq -r '
              "**Reproduced**: \(.baseline.failures)/\(.baseline.attempts) attempts failed  ",
              "**Confidence**: \(.confidence)  ",
              (if .comparison then
                "**Base/head**: base \(.comparison.base.failures)/\(.comparison.base.attempts), head \(.comparison.head.failures)/\(.comparison.head.attempts) → `\(.comparison.verdict)`  "
              else empty end),
              (if .localization.first_known_bad then
                "**First known bad**: `\(.localization.first_known_bad)`  "
              else empty end),
              (if .refused then "**Refused**: \(.refusal_reason)  " else empty end),
              "",
              (if ((.localization.likely_files // []) | length) > 0 then
                "**Likely files**:\n" + ((.localization.likely_files // []) | map("- `\(.)`") | join("\n"))
              else empty end),
              "",
              (if ((.claims // []) | length) > 0 then
                "**Hypotheses**:\n" + ((.claims // []) | map("- (confidence \(.confidence)) \(.statement)") | join("\n"))
              else empty end),
              "",
              (if ((.uncertainty // []) | length) > 0 then
                "**Uncertainty**:\n" + ((.uncertainty // []) | map("- \(.)") | join("\n"))
              else empty end)
            ' "$RUNNER_TEMP/causent-report.json"
            echo
            echo "Bundle: \`$(jq -r '.bundle_path // "not written"' "$RUNNER_TEMP/causent-report.json")\`"
          } > "$RUNNER_TEMP/causent-summary.md"
          cat "$RUNNER_TEMP/causent-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnosis bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causent-diagnosis-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/causent-report.json
            ${{ runner.temp }}/causent-summary.md
            ${{ runner.temp }}/causent-stderr.log
            ${{ runner.temp }}/causent-failed.log
            ${{ runner.temp }}/causent-failed-jobs.txt
            ${{ runner.temp }}/causent-bundle
          if-no-files-found: ignore

  publish:
    name: Publish diagnosis
    needs: diagnose
    if: needs.diagnose.result == 'success' && inputs.comment && needs.diagnose.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download diagnosis result
        uses: actions/download-artifact@v4
        with:
          name: causent-diagnosis-${{ github.run_id }}
          path: "$RUNNER_TEMP/causent-result"

      - name: Prepare bounded diagnosis comment
        env:
          PR_NUMBER: ${{ needs.diagnose.outputs.pr }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/causent-result/causent-report.json"
          test -s "$report"
          classification="$(jq -r '.classification // "unknown"' "$report")"
          refused="$(jq -r '.refused // false' "$report")"
          failures="$(jq -r '.baseline.failures // 0' "$report")"
          attempts="$(jq -r '.baseline.attempts // 0' "$report")"
          bundle="$(jq -r '.bundle_path // "not written"' "$report")"
          body=$(cat <<EOF
          ## Causent diagnosis

          **Classification:** ${classification}
          **Reproduced:** $failures/$attempts attempts failed
          **Refused:** $refused

          The full bounded result is available in the workflow artifact.
          Bundle path recorded by the runner: ${bundle}
          EOF
          )
          printf '%s\n' "$body" > "$RUNNER_TEMP/causent-comment.md"

      - name: Publish bounded diagnosis comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.diagnose.outputs.pr }}
          COMMENT_PATH: ${{ runner.temp }}/causent-comment.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const issueNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              throw new Error(`Invalid pull request number: ${process.env.PR_NUMBER}`);
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            } catch (error) {
              core.setFailed(`Unable to publish diagnosis comment: ${error.status ?? 'unknown'} ${error.message}`);
            }
